spring.application.name=fitness

# Datasource configuration via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/app_alimentacion}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session configuration (HTTP Session, 7 days, HttpOnly, SameSite=Lax)
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
